name: fix-context-logo

on:
  push:
    branches:
      - issue-1-context-statusbar

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install fontTools
        run: python -m pip install fonttools

      - name: Restore composite font and recenter logo
        run: |
          git checkout 18fe5260bef1bc7c9469614ba3c8c3a18b14afb6 -- resources/claude-context-ring.woff
          python - <<'PY'
          from fontTools.ttLib import TTFont

          path = "resources/claude-context-ring.woff"
          font = TTFont(path)
          glyf = font["glyf"]

          ring_center_x = 460
          logo_center_x = 500
          logo_center_y = 500
          scale = 1.20

          for glyph_name in font.getGlyphOrder():
              glyph = glyf[glyph_name]
              if glyph.numberOfContours < 2:
                  continue

              start = 0
              for contour_index, end in enumerate(glyph.endPtsOfContours):
                  if contour_index == 1:
                      for i in range(start, end + 1):
                          x, y = glyph.coordinates[i]
                          glyph.coordinates[i] = (
                              round(ring_center_x + scale * (x - logo_center_x)),
                              round(logo_center_y + scale * (y - logo_center_y)),
                          )
                      break
                  start = end + 1

              glyph.recalcBounds(glyf)

          font.save(path)
          PY

      - name: Commit font
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/claude-context-ring.woff
          git commit -m "center and enlarge Claude logo in context ring [skip ci]"
          git push
