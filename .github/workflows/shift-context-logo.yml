name: shift-context-logo

on:
  push:
    branches:
      - issue-1-context-statusbar

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install fontTools
        run: python -m pip install fonttools

      - name: Shift Claude logo left
        run: |
          python - <<'PY'
          from fontTools.ttLib import TTFont

          path = "resources/claude-context-ring.woff"
          font = TTFont(path)
          glyf = font["glyf"]

          old_center_x = 460
          new_center_x = 400
          shift_x = new_center_x - old_center_x

          for glyph_name in font.getGlyphOrder():
              glyph = glyf[glyph_name]
              if glyph.numberOfContours < 2:
                  continue

              start = 0
              for contour_index, end in enumerate(glyph.endPtsOfContours):
                  if contour_index == 1:
                      for i in range(start, end + 1):
                          x, y = glyph.coordinates[i]
                          glyph.coordinates[i] = (round(x + shift_x), y)
                      break
                  start = end + 1

              glyph.recalcBounds(glyf)

          font.save(path)
          PY

      - name: Commit font
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/claude-context-ring.woff
          git commit -m "shift Claude logo left in context ring [skip ci]"
          git push
